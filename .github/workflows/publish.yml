name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release tag
        run: |
          python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME'] == f'v{version}', f'Expected tag v{version}'"
      - name: Install build and test dependencies
        run: python -m pip install -e ".[test,lint]"
      - name: Build frontend assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Compile translations
        run: python scripts/compile_translations.py
      - name: Run tests and lint
        run: |
          python -m pytest
          python -m ruff check bd_editor tests
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bd-editor
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

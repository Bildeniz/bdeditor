name: Tests and package validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "5.2"
          - python-version: "3.11"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "5.2"
          - python-version: "3.14"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "6.0"
          - python-version: "3.13"
            django-version: "6.0"
          - python-version: "3.14"
            django-version: "6.0"
          - python-version: "3.12"
            django-version: "6.1"
          - python-version: "3.13"
            django-version: "6.1"
          - python-version: "3.14"
            django-version: "6.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[test,lint]" "Django~=${{ matrix.django-version }}.0"
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: python scripts/compile_translations.py
      - run: python -m pytest
      - run: python -m ruff check bd_editor tests
      - run: python -m build
      - run: python -m twine check dist/*

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-editor"
version = "0.1.0"
description = "A secure, configurable rich-text editor for Django admin and forms."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BD-Editor contributors" }]
keywords = ["django", "editor", "rich-text", "admin", "sanitization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Django>=5.2,<6.2",
    "nh3>=0.2.18",
]

[project.optional-dependencies]
images = ["Pillow>=10.4"]
test = [
    "build>=1.2",
    "Pillow>=10.4",
    "polib>=1.2",
    "pytest>=8.3",
    "pytest-django>=4.10",
    "twine>=6.0",
]
i18n = ["polib>=1.2"]
lint = ["ruff>=0.9"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bd_editor*"]

[tool.setuptools.package-data]
bd_editor = ["static/**/*", "templates/**/*", "locale/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build", "dist", "frontend/node_modules"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
